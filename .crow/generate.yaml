when:
  - event: manual

steps:
  generate:
    image: "ghcr.io/astral-sh/uv:python3.13-trixie"
    commands:
      - apt-get update
      - apt-get install -y tesseract-ocr
      - uv sync --locked
      - uv run extract_dates.py

  push-changes:
    image: "appleboy/drone-git-push:1.1"
    pull: true
    settings:
      ssh_key:
        from_secret: ssh_key
      remote: ${CI_REPO_CLONE_SSH_URL}
      branch: main
      force: true
      commit: true
      commit_message: "Generate output"
      author_name: BuriedInCode
      author_email: "buriedincode@noreply.codefloe.com"
