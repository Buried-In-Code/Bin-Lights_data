depends_on:
  - linting

when:
  - event: push
    branch: main
  - event: pull_request
    branch: main

matrix:
  include:
    - python: "3.14"

steps:
  pytest:
    image: "ghcr.io/astral-sh/uv:python${python}-trixie-slim"
    commands:
      - uv sync --locked --no-dev --all-extras --group tests
      - uv run --no-dev pytest
