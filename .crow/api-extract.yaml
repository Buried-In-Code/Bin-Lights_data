when:
  - event: cron
    cron: bin-lights_api-extract
  - event: manual

steps:
  generate:
    image: "ghcr.io/astral-sh/uv:python3.14-trixie-slim"
    commands:
      - uv sync --locked --extra api-extract
      - uv run bin-api-extract

  push-changes:
    image: "appleboy/drone-git-push:1.2"
    pull: true
    settings:
      ssh_key:
        from_secret: ssh_key
      remote: ${CI_REPO_CLONE_SSH_URL}
      branch: main
      force: true
      commit: true
      commit_message: "Generate api extract output"
      author_name: BuriedInCode
      author_email: "buriedincode@noreply.codefloe.com"
