when:
  - event: push
    branch: main
  - event: pull_request
    branch: main

matrix:
  include:
    - python: 3.13
    - python: 3.14

steps:
  pytest:
    image: "cr.codefloe.com/ghcr.io/astral-sh/uv:python${python}-trixie-slim"
    commands:
      - uv sync --locked --group tests --all-extras
      - uv run pytest
